<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis – वॉइस असिस्टेंट</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap">
<style>
:root{--bg:#04101f;--card:rgba(10,26,48,.55);--tx:#e6f6ff;--mut:#8fb0c9;--ac:#22d3ee;--on:#fbbf24;--bd:rgba(80,200,255,.28);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(ellipse at 50% 20%,#0b2a4a 0%,#04101f 60%,#02060e 100%) fixed}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--tx);font:400 16px/1.5 Hind,system-ui,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:34px;margin:4px 0 0;font-weight:700;letter-spacing:.04em;color:#eaffff;text-shadow:0 0 18px rgba(34,211,238,.75),0 0 42px rgba(34,211,238,.35)}
h2{font-size:18px;margin:28px 0 10px;font-weight:600;color:#bfefff}
.m{color:var(--mut);margin:2px 0 0}
.orb{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0 18px}
#orbwrap{position:relative;width:240px;height:240px}
#orbcv{position:absolute;inset:0;width:240px;height:240px}
#mic{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:2px solid rgba(120,255,240,.7);font-size:34px;line-height:1;background:rgba(2,16,30,.45);backdrop-filter:blur(4px);color:#fff;cursor:pointer;box-shadow:0 0 22px rgba(34,211,238,.55),inset 0 0 18px rgba(34,211,238,.35);transition:transform .2s,border-color .3s,box-shadow .3s}
#mic:hover{transform:scale(1.06)}
#mic.hot{border-color:var(--on);box-shadow:0 0 30px rgba(251,191,36,.7),inset 0 0 20px rgba(251,191,36,.4);animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){#mic.hot{animation:none}.dev.on span{animation:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.row{display:flex;gap:8px}
input[type=text],input[type=password]{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);backdrop-filter:blur(8px);color:var(--tx);font:inherit}
input::placeholder{color:#6f93ad}
.btn{padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);backdrop-filter:blur(8px);color:var(--tx);font:inherit;cursor:pointer;transition:box-shadow .25s,border-color .25s}
.btn:hover{border-color:var(--ac);box-shadow:0 0 16px rgba(34,211,238,.35)}
#log{margin-top:14px;display:flex;flex-direction:column;gap:6px}
#log div{padding:8px 12px;border-radius:10px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--bd)}
#log .U{color:var(--mut)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:900px}
.dev{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(10px);color:var(--tx);font:inherit;text-align:left;cursor:pointer;transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .35s,background .35s,border-color .35s;will-change:transform}
.dev span{font-size:30px;display:inline-block;transform:translateZ(34px)}
.dev b,.dev small{transform:translateZ(18px)}
.dev small{opacity:.75}
.dev.on{background:linear-gradient(145deg,rgba(251,191,36,.96),rgba(245,158,11,.86));border-color:var(--on);color:#1b1300;box-shadow:0 0 30px rgba(251,191,36,.55),0 12px 30px rgba(0,0,0,.45)}
.dev.on span{animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateZ(48px) translateY(-3px)}}
.rts{display:flex;flex-wrap:wrap;gap:8px}
#ps{margin:8px 0 0}
label{color:var(--mut)}
[hidden]{display:none!important}#auth{margin-top:40px;display:flex;flex-direction:column;gap:10px}#auth input{flex:none}#aerr{color:#ff8a8a;margin:0}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
<div id="auth" hidden>
  <h1>Jarvis</h1>
  <p class="m">साइन अप करो या लॉगिन करो।</p>
  <input type="text" id="an" placeholder="नाम (साइन अप के लिए)" aria-label="नाम">
  <input type="text" id="ae" placeholder="ईमेल" aria-label="ईमेल" autocomplete="email">
  <input type="password" id="ap" placeholder="पासवर्ड (6+ अक्षर)" aria-label="पासवर्ड" autocomplete="current-password">
  <div class="row"><button class="btn" id="li">लॉगिन</button><button class="btn" id="su">साइन अप</button></div>
  <p id="aerr" role="alert"></p>
</div>
<div id="app" hidden>
<h1>Jarvis</h1>
<p class="m" id="st">बोलो या लिखो: “लाइट ऑन कर”, “good night”, “volume up”</p>

<div class="orb">
  <div id="orbwrap">
    <canvas id="orbcv" aria-hidden="true"></canvas>
    <button id="mic" aria-label="बोलना शुरू करो">🎤</button>
  </div>
  <p class="m" style="text-align:center">mic दबाओ और सीधे बात करो, “Jarvis” बोलना ज़रूरी नहीं</p>
</div>

<div class="row">
  <input type="text" id="txt" placeholder="कमांड लिखो और Enter दबाओ" aria-label="कमांड">
  <button class="btn" id="go">भेजो</button>
</div>
<div id="log"></div>

<h2>डिवाइस</h2>
<div id="grid"></div>

<h2>रूटीन</h2>
<div class="rts">
  <button class="btn" data-r="good morning">सुप्रभात</button>
  <button class="btn" data-r="good night">शुभ रात्रि</button>
</div>

<h2>PC एजेंट</h2>
<p class="m">अपने PC पर agent.py चलाओ, फिर उसका token यहाँ डालो। Chrome में लाइव साइट से भी जुड़ जाएगा।</p>
<div class="row" style="margin-top:8px">
  <input type="text" id="tok" placeholder="agent token" aria-label="agent token">
  <button class="btn" id="conn">जोड़ो</button>
</div>
<p class="m" id="ps">⚪ जुड़ा नहीं</p>
<p><button class="btn" id="lo">लॉग आउट</button></p>
</div>
</main>

<script>
const $=s=>document.querySelector(s);
const J3={pulse:0,think:0};let speaking=false,speakEnd=0,spT=0,spId=0;const H=[];
let NAME='',TOKEN='';try{TOKEN=localStorage.getItem('jt')||''}catch(e){}
const D={light:{n:'लाइट',i:'💡',k:['light','lights','लाइट','लाईट','लाइट्स','बत्ती','batti','bulb','बल्ब']},
 fan:{n:'पंखा',i:'🌀',k:['fan','पंखा','पंखे','pankha','फैन']},
 ac:{n:'AC',i:'❄️',k:['ac','एसी','ए सी','ए.सी','एयर कंडीशनर']},
 tv:{n:'TV',i:'📺',k:['tv','टीवी','टी वी','टी.वी','television','टेलीविजन']}};
let S={light:0,fan:0,ac:0,tv:0},ws=null,rec=null,listening=false,W=[];
async function api(p,m,b){const r=await fetch(p,{method:m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'कुछ गड़बड़ हुई');return j}
const save=()=>{api('/api/devices','PUT',S).catch(()=>{})};
async function ask(t){J3.think=1;setSt('🤔 सोच रहा हूँ…',true);try{const r=await api('/api/chat','POST',{text:t,history:H.slice(-8)});H.push({r:'user',t},{r:'model',t:r.reply});if(H.length>12)H.splice(0,H.length-12);S=Object.assign(S,r.devices);render();say(r.reply);(r.pc||[]).forEach(pc)}catch(e){say(e.message)}finally{J3.think=0;setSt(ST0)}}
function render(){$('#grid').innerHTML=Object.keys(D).map(k=>`<button class="dev ${S[k]?'on':''}" data-k="${k}"><span>${D[k].i}</span><b>${D[k].n}</b><small>${S[k]?'चालू':'बंद'}</small></button>`).join('')}
$('#grid').onclick=e=>{const b=e.target.closest('.dev');if(b){S[b.dataset.k]^=1;save();render()}};
function log(w,t){const d=document.createElement('div');d.className=w;d.textContent=(w==='U'?'🧑 ':'🤖 ')+t;$('#log').prepend(d);while($('#log').children.length>8)$('#log').lastChild.remove()}
function say(t,quiet){
 J3.pulse=1;log('J',t);if(quiet)return;
 try{
  const id=++spId,u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';
  const done=()=>{if(id!==spId)return;speaking=false;speakEnd=Date.now();clearTimeout(spT)};
  u.onend=u.onerror=done;
  speaking=true;clearTimeout(spT);spT=setTimeout(done,Math.min(20000,1000+t.length*130));
  try{rec&&rec.abort()}catch(e){}
  speechSynthesis.cancel();speechSynthesis.speak(u);
 }catch(e){speaking=false}
}
const has=(t,a)=>a.some(x=>/^[a-z]+$/.test(x)?W.includes(x):t.includes(x));
const ON=['on','ऑन','आन','ओन','चालू','चला','जला','जलाओ','लगा','शुरू','स्टार्ट','खोल','chalu','chala','jala','laga','start'],OFF=['off','ऑफ','ऑफ़','आफ','ओफ','बंद','बन्द','बुझा','band','bujha','stop'];
function pc(o){if(!ws||ws.readyState!==1)return say('PC एजेंट जुड़ा नहीं है। PC ऐप खोलने के लिए agent.py चलाओ। वेबसाइट के लिए एजेंट नहीं चाहिए।');ws.send(JSON.stringify(o))}

/* websites: browser ke andar khulte hain, agent.py ki zaroorat nahi */
const SITES=[
 {k:['youtube','यूट्यूब','यूटयूब'],n:'YouTube',u:'https://www.youtube.com',q:'https://www.youtube.com/results?search_query='},
 {k:['google','गूगल'],n:'Google',u:'https://www.google.com',q:'https://www.google.com/search?q='},
 {k:['gmail','जीमेल'],n:'Gmail',u:'https://mail.google.com'},
 {k:['whatsapp','व्हाट्सएप','व्हाट्सऐप','वॉट्सऐप'],n:'WhatsApp',u:'https://web.whatsapp.com'},
 {k:['maps','मैप्स'],n:'Google Maps',u:'https://maps.google.com',q:'https://www.google.com/maps/search/'},
 {k:['spotify','स्पॉटिफाई'],n:'Spotify',u:'https://open.spotify.com',q:'https://open.spotify.com/search/'},
 {k:['instagram','इंस्टाग्राम'],n:'Instagram',u:'https://www.instagram.com'},
 {k:['facebook','फेसबुक'],n:'Facebook',u:'https://www.facebook.com'},
 {k:['github','गिटहब'],n:'GitHub',u:'https://github.com'},
 {k:['linkedin','लिंक्डइन'],n:'LinkedIn',u:'https://www.linkedin.com'}];
const OPENV=['open','ओपन','खोल','चला','बजा','play','search','सर्च','खोज','ढूंढ','launch','kholo','khol','chalao','bajao','dhundo'];
const SEARCHV=['play','चला','बजा','search','सर्च','खोज','ढूंढ','chalao','bajao','dhundo'];
const FILL=new Set(['open','ओपन','खोलो','खोल','खोलिए','चलाओ','चला','बजाओ','बजा','play','search','सर्च','खोजो','खोज','ढूंढो','ढूंढ','पर','पे','में','on','in','for','करो','कर','दो','दीजिए','मेरे','लिए','मुझे','का','की','के','को','से','वीडियो','video','song','गाना','jarvis','जार्विस','please','प्लीज','kar','karo','do','pe','par','mein','kholo','khol','chalao','bajao','dhundo','launch','जाओ']);
function openSite(url,label){
 const w=window.open(url,'_blank');
 if(w){try{w.opener=null}catch(e){}return}
 const d=document.createElement('div');d.className='J';const a=document.createElement('a');
 a.href=url;a.target='_blank';a.rel='noopener';a.textContent='👉 '+label+' खोलने के लिए यहाँ दबाओ';a.style.color='var(--on)';
 d.append('🤖 ',a);$('#log').prepend(d);
 setSt('⚠️ ब्राउज़र ने पॉपअप रोका। लिंक दबाओ, या एड्रेस बार में पॉपअप “Always allow” करो।');
}

function run(raw){
 const t=raw.toLowerCase().trim();if(!t)return;W=t.split(/[\s,.?!।]+/);log('U',raw);
 if(has(t,['good night','गुड नाइट','गुड नाईट','शुभ रात्रि'])){Object.keys(S).forEach(k=>S[k]=0);save();render();return say('शुभ रात्रि '+NAME+'। सब बंद कर दिया।',true)}
 if(has(t,['good morning','गुड मॉर्निंग','सुप्रभात'])){S.light=1;S.fan=1;save();render();return say('सुप्रभात '+NAME+'। लाइट और पंखा चालू कर दिए।',true)}
 const on=has(t,ON),off=has(t,OFF);
 const dks=Object.keys(D).filter(k=>has(t,D[k].k));
 if(dks.length&&(on||off)){dks.forEach(k=>S[k]=off?0:1);save();render();return say(dks.map(k=>D[k].n).join(' और ')+(off?' बंद':' चालू')+' कर दिया।',true)}
 if(!dks.length&&(on||off)&&has(t,['सब','सारे','सारी','सभी','all','everything'])){Object.keys(S).forEach(k=>S[k]=off?0:1);save();render();return say('सब डिवाइस '+(off?'बंद':'चालू')+' कर दिए।',true)}
 if(has(t,['volume','वॉल्यूम','आवाज़','आवाज'])){const d=has(t,['up','बढ़ा','बढा','badha','increase'])?'up':has(t,['down','कम','kam','decrease'])?'down':has(t,['mute','म्यूट'])?'mute':'';
  return d?pc({action:'volume',dir:d}):say('वॉल्यूम बढ़ाना है, घटाना है या म्यूट?')}
 if(has(t,['screenshot','स्क्रीनशॉट']))return pc({action:'screenshot'});
 const apps={notepad:['notepad','नोटपैड'],calculator:['calculator','कैलकुलेटर'],chrome:['chrome','क्रोम'],vscode:['vscode','वीएस कोड']};
 const ak=Object.keys(apps).find(k=>has(t,apps[k]));if(ak)return pc({action:'open_app',name:ak});
 const tm=t.match(/(\d+)\s*(min|मिनट|sec|सेकंड|second)/);
 if(tm&&has(t,['timer','टाइमर'])){const n=+tm[1],ms=n*(/^(min|मिनट)/.test(tm[2])?60000:1000);setTimeout(()=>say('टाइमर पूरा हुआ।'),ms);return say('टाइमर '+tm[0]+' का सेट किया।')}
 if(has(t,['time','टाइम','समय','baje','बजे'])&&!has(t,OPENV))return say('अभी '+new Date().toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'})+' हुए हैं।');
 const site=has(t,OPENV)?SITES.find(s=>has(t,s.k)):null;
 if(site){
  const bad=new Set([...site.k,...FILL]);
  const q=t.split(/[\s,.?!।]+/).filter(w=>w&&!bad.has(w)).join(' ');
  if(q&&site.q&&has(t,SEARCHV)){openSite(site.q+encodeURIComponent(q),site.n);return say(site.n+' पर “'+q+'” खोल रहा हूँ।',true)}
  openSite(site.u,site.n);return say(site.n+' खोल रहा हूँ।',true)
 }
 ask(raw);
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function onVoice(t){
 const m=t.match(/^\s*(jarvis|जार्विस|जारविस|जरविस|जर्विस|जार्वस|जार्विश|जारवीस|जार्वीस|जरवीस)[\s,।.!?]*/i);
 const rest=m?t.slice(m[0].length).trim():t.trim();
 if(!rest)return say('जी '+NAME+', बोलिए।');
 run(rest);
}
const ST0=$('#st').textContent;let stT=0;
function setSt(t,keep){$('#st').textContent=t;clearTimeout(stT);if(!keep)stT=setTimeout(()=>{$('#st').textContent=ST0},6000)}
const VERR={'network':'वॉइस सर्विस नहीं मिली। इंटरनेट चेक करो। Brave में वॉइस नहीं चलता, Chrome या Edge में खोलो।','not-allowed':'माइक की अनुमति दो (एड्रेस बार में 🔒 पर क्लिक करके)।','service-not-allowed':'इस ब्राउज़र में वॉइस बंद है। Chrome या Edge इस्तेमाल करो।','audio-capture':'माइक नहीं मिला। माइक चेक करो।','language-not-supported':'यह भाषा सपोर्ट नहीं है।'};
const FATAL=['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'];

/* Voice engine: ek-ek vakya sunta hai, jawab/command chalata hai, phir turant dobara sunta hai.
   Jarvis jab bolta hai tab mic band rehta hai (echo nahi), bolna khatam hote hi apne aap shuru. */
function stopListen(msg){listening=false;try{rec&&rec.abort()}catch(e){}$('#mic').classList.remove('hot');if(msg)setSt(msg,true);else setSt(ST0)}
function listenOnce(){
 if(!listening)return;
 if(speaking){setTimeout(listenOnce,150);return}
 let got=false;const r=new SR();rec=r;
 r.lang='hi-IN';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
 r.onstart=()=>{if(!got)setSt('🎤 बोलो, मैं सुन रहा हूँ…',true)};
 r.onresult=e=>{let fin='',tmp='';
  for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript}
  if(fin.trim()){got=true;setSt('सुना: “'+fin.trim()+'”',true);onVoice(fin.trim())}
  else if(tmp)setSt('🎤 '+tmp,true)};
 r.onerror=e=>{if(FATAL.includes(e.error)){const m=VERR[e.error]||('वॉइस एरर: '+e.error);stopListen('⚠️ '+m);say(m)}};
 r.onend=()=>{if(!listening){$('#mic').classList.remove('hot');return}if(rec===r)setTimeout(listenOnce,got?30:150)};
 try{r.start()}catch(err){setTimeout(listenOnce,400)}
}
$('#mic').onclick=()=>{
 if(!SR)return say('इस ब्राउज़र में वॉइस सपोर्ट नहीं है। Chrome इस्तेमाल करो।');
 if(listening)return stopListen();
 listening=true;$('#mic').classList.add('hot');try{speechSynthesis.cancel()}catch(e){}listenOnce();
};
$('#go').onclick=()=>{run($('#txt').value);$('#txt').value=''};
$('#txt').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>run(b.dataset.r));
$('#conn').onclick=()=>{
 try{ws=new WebSocket('ws://127.0.0.1:8765');
  ws.onopen=()=>ws.send(JSON.stringify({token:$('#tok').value.trim()}));
  ws.onmessage=e=>{const r=JSON.parse(e.data);if(r.hello)$('#ps').textContent=r.ok?'🟢 PC जुड़ा':'🔴 गलत token';else say(r.msg)};
  ws.onclose=()=>{$('#ps').textContent='⚪ जुड़ा नहीं'};
  ws.onerror=()=>{$('#ps').textContent='🔴 एजेंट नहीं मिला। agent.py चलाओ और पेज लोकल खोलो।'};
 }catch(e){$('#ps').textContent='🔴 कनेक्शन नहीं बना'}
};
function enter(){$('#auth').hidden=true;$('#app').hidden=false;render()}
async function doAuth(kind){try{const j=await api('/api/'+kind,'POST',{name:$('#an').value,email:$('#ae').value,password:$('#ap').value});TOKEN=j.token;try{localStorage.setItem('jt',TOKEN)}catch(e){}NAME=j.name;S=Object.assign(S,j.devices);enter();say('नमस्ते '+NAME+'।')}catch(e){$('#aerr').textContent=e.message}}
$('#li').onclick=()=>doAuth('login');$('#su').onclick=()=>doAuth('signup');
$('#lo').onclick=()=>{try{localStorage.removeItem('jt')}catch(e){}location.reload()};
if(TOKEN)api('/api/me').then(j=>{NAME=j.name;S=Object.assign(S,j.devices);enter()}).catch(()=>{$('#auth').hidden=false});else $('#auth').hidden=false;

/* device cards: 3D tilt */
(()=>{const g=$('#grid');
 g.addEventListener('pointermove',e=>{const d=e.target.closest('.dev');if(!d)return;const r=d.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;d.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg) translateZ(10px)`});
 g.addEventListener('pointerout',e=>{const d=e.target.closest('.dev');if(d&&!d.contains(e.relatedTarget))d.style.transform=''});
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* 3D: arc-reactor orb + holographic background. Fail hone par app normal chalta rahega. */
(()=>{try{
if(!window.THREE)return;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,sp=reduce?.15:1;
const PR=Math.min(window.devicePixelRatio||1,2);
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);
 r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(130,255,240,.55)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const pm={x:0,y:0};addEventListener('pointermove',e=>{pm.x=e.clientX/innerWidth*2-1;pm.y=e.clientY/innerHeight*2-1});

/* ---- background ---- */
const R=new THREE.WebGLRenderer({canvas:$('#bg'),alpha:true,antialias:true});R.setPixelRatio(PR);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,300);cam.position.z=30;
const N=reduce?400:1000,pp=new Float32Array(N*3);
for(let i=0;i<N;i++){pp[i*3]=(Math.random()-.5)*110;pp[i*3+1]=(Math.random()-.5)*70;pp[i*3+2]=(Math.random()-.5)*80}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pmat=new THREE.PointsMaterial({size:.9,map:glowTex,color:0x66e8ff,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending});
const pts=new THREE.Points(pg,pmat);sc.add(pts);
const rings=[[16,0x22d3ee],[21,0x3b82f6],[26,0x22d3ee]].map(([r,c],i)=>{
 const m=new THREE.Mesh(new THREE.TorusGeometry(r,.06,8,160),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.35}));
 m.position.z=-25;m.rotation.x=1.1+i*.35;m.rotation.y=i*.6;sc.add(m);return m});
const grid=new THREE.GridHelper(160,40,0x22d3ee,0x22d3ee);grid.position.y=-22;grid.material.transparent=true;grid.material.opacity=.14;sc.add(grid);
function sizeBg(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
sizeBg();addEventListener('resize',sizeBg);

/* ---- orb ---- */
const oc=$('#orbcv'),R2=new THREE.WebGLRenderer({canvas:oc,alpha:true,antialias:true});R2.setPixelRatio(PR);R2.setSize(240,240,false);
const s2=new THREE.Scene(),c2=new THREE.PerspectiveCamera(45,1,.1,50);c2.position.z=9;
const og=new THREE.Group();s2.add(og);
const core=new THREE.Mesh(new THREE.SphereGeometry(1.5,32,32),new THREE.MeshBasicMaterial({color:0x5ffcf0}));
const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(2.1,1),new THREE.MeshBasicMaterial({color:0x22d3ee,wireframe:true,transparent:true,opacity:.55}));
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0x66fff0,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
og.add(core,shell,glow);
const orings=[2.6,3.0,3.4].map((r,i)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(r,.035,8,96),new THREE.MeshBasicMaterial({color:i==1?0x3b82f6:0x22d3ee,transparent:true,opacity:.85}));
 m.rotation.set(i*1.0,i*.7,0);og.add(m);return m});
const cIdle=new THREE.Color(0x5ffcf0),cHot=new THREE.Color(0xfbbf24),cThink=new THREE.Color(0xc084fc),cur=new THREE.Color(0x5ffcf0),tgt=new THREE.Color();

let t=0,e=0,last=performance.now();
function tick(now){requestAnimationFrame(tick);
 const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
 const hot=$('#mic').classList.contains('hot'),th=J3.think;
 J3.pulse*=.94;
 const target=(hot?.6:0)+(th?.5+.2*Math.sin(t*8):0)+J3.pulse;e+=(target-e)*.12;
 const on=Object.values(S).filter(Boolean).length;
 /* bg */
 pts.rotation.y+=dt*.02*sp*(1+on*.5);pts.rotation.x=Math.sin(t*.1)*.05;
 pmat.opacity=.55+on*.08+e*.15;
 rings.forEach((m,i)=>{m.rotation.z+=dt*(.08+i*.04)*sp*(1+e)});
 grid.position.z=(t*3*sp)%4;
 cam.position.x+=(pm.x*3-cam.position.x)*.03;cam.position.y+=(-pm.y*2-cam.position.y)*.03;cam.lookAt(0,0,0);
 R.render(sc,cam);
 /* orb */
 if(!$('#app').hidden){
  tgt.copy(hot?cHot:th?cThink:cIdle);cur.lerp(tgt,.08);
  core.material.color.copy(cur);glow.material.color.copy(cur);shell.material.color.copy(cur);
  core.scale.setScalar(1+e*.25+Math.sin(t*2)*.03);
  glow.scale.setScalar(7+e*3);glow.material.opacity=.55+Math.min(e,.6)*.5;
  shell.rotation.x+=dt*.5*sp*(1+e*3);shell.rotation.y+=dt*.7*sp*(1+e*3);
  orings.forEach((m,i)=>{m.rotation.x+=dt*(.4+i*.25)*sp*(1+e*2);m.rotation.y+=dt*(.5-i*.15)*sp*(1+e*2);m.material.color.copy(i==1?cur.clone().lerp(new THREE.Color(0x3b82f6),.6):cur)});
  og.rotation.y+=((pm.x*.5)-og.rotation.y)*.05;og.rotation.x+=((pm.y*.4)-og.rotation.x)*.05;
  R2.render(s2,c2);
 }
}
requestAnimationFrame(tick);
}catch(err){console.warn('3D off:',err)}})();
</script>
</body>
</html>
