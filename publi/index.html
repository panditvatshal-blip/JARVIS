<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis – वॉइस असिस्टेंट</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap">
<style>
:root{--bg:#eef1f7;--card:#fff;--tx:#1b2440;--mut:#5d6785;--ac:#0f766e;--on:#f59e0b;--bd:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2e;--card:#1b2540;--tx:#e9edf8;--mut:#9aa5c4;--ac:#2dd4bf;--on:#fbbf24;--bd:#2b3658;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a2e;--card:#1b2540;--tx:#e9edf8;--mut:#9aa5c4;--ac:#2dd4bf;--on:#fbbf24;--bd:#2b3658;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Hind,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:30px;margin:4px 0 0;font-weight:700}
h2{font-size:18px;margin:28px 0 10px;font-weight:600}
.m{color:var(--mut);margin:2px 0 0}
.orb{display:flex;flex-direction:column;align-items:center;gap:12px;margin:22px 0}
#mic{width:112px;height:112px;border-radius:50%;border:0;font-size:44px;background:var(--ac);color:#fff;cursor:pointer;box-shadow:0 0 0 8px color-mix(in srgb,var(--ac) 20%,transparent)}
#mic.hot{animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 22px color-mix(in srgb,var(--ac) 8%,transparent)}}
@media(prefers-reduced-motion:reduce){#mic.hot{animation:none}}
button:focus-visible,input:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.row{display:flex;gap:8px}
input[type=text],input[type=password]{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.btn{padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
#log{margin-top:14px;display:flex;flex-direction:column;gap:6px}
#log div{padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
#log .U{color:var(--mut)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dev{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.dev span{font-size:28px}
.dev.on{background:var(--on);border-color:var(--on);color:#1b2440}
.dev small{opacity:.75}
.rts{display:flex;flex-wrap:wrap;gap:8px}
#ps{margin:8px 0 0}
[hidden]{display:none!important}#auth{margin-top:40px;display:flex;flex-direction:column;gap:10px}#auth input{flex:none}#aerr{color:#dc2626;margin:0}
</style>
</head>
<body>
<main>
<div id="auth" hidden>
  <h1>Jarvis</h1>
  <p class="m">साइन अप करो या लॉगिन करो।</p>
  <input type="text" id="an" placeholder="नाम (साइन अप के लिए)" aria-label="नाम">
  <input type="text" id="ae" placeholder="ईमेल" aria-label="ईमेल" autocomplete="email">
  <input type="password" id="ap" placeholder="पासवर्ड (6+ अक्षर)" aria-label="पासवर्ड" autocomplete="current-password">
  <div class="row"><button class="btn" id="li">लॉगिन</button><button class="btn" id="su">साइन अप</button></div>
  <p id="aerr" role="alert"></p>
</div>
<div id="app" hidden>
<h1>Jarvis</h1>
<p class="m" id="st">बोलो या लिखो: “लाइट ऑन कर”, “good night”, “volume up”</p>

<div class="orb">
  <button id="mic" aria-label="बोलना शुरू करो">🎤</button>
  <label><input type="checkbox" id="wake"> हमेशा सुनो, “Jarvis” बोलने पर जागो</label>
</div>

<div class="row">
  <input type="text" id="txt" placeholder="कमांड लिखो और Enter दबाओ" aria-label="कमांड">
  <button class="btn" id="go">भेजो</button>
</div>
<div id="log"></div>

<h2>डिवाइस</h2>
<div id="grid"></div>

<h2>रूटीन</h2>
<div class="rts">
  <button class="btn" data-r="good morning">सुप्रभात</button>
  <button class="btn" data-r="good night">शुभ रात्रि</button>
</div>

<h2>PC एजेंट</h2>
<p class="m">अपने PC पर agent.py चलाओ, फिर उसका token यहाँ डालो। Chrome में लाइव साइट से भी जुड़ जाएगा।</p>
<div class="row" style="margin-top:8px">
  <input type="text" id="tok" placeholder="agent token" aria-label="agent token">
  <button class="btn" id="conn">जोड़ो</button>
</div>
<p class="m" id="ps">⚪ जुड़ा नहीं</p>
<p><button class="btn" id="lo">लॉग आउट</button></p>
</div>
</main>

<script>
const $=s=>document.querySelector(s);
let NAME='',TOKEN='';try{TOKEN=localStorage.getItem('jt')||''}catch(e){}
const D={light:{n:'लाइट',i:'💡',k:['light','लाइट','बत्ती','batti','bulb']},
 fan:{n:'पंखा',i:'🌀',k:['fan','पंखा','pankha']},
 ac:{n:'AC',i:'❄️',k:['ac','एसी']},
 tv:{n:'TV',i:'📺',k:['tv','टीवी','television']}};
let S={light:0,fan:0,ac:0,tv:0},ws=null,rec=null,listening=false,W=[];
async function api(p,m,b){const r=await fetch(p,{method:m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'कुछ गड़बड़ हुई');return j}
const save=()=>{api('/api/devices','PUT',S).catch(()=>{})};
async function ask(t){try{const r=await api('/api/chat','POST',{text:t});S=Object.assign(S,r.devices);render();say(r.reply);(r.pc||[]).forEach(pc)}catch(e){say(e.message)}}
function render(){$('#grid').innerHTML=Object.keys(D).map(k=>`<button class="dev ${S[k]?'on':''}" data-k="${k}"><span>${D[k].i}</span><b>${D[k].n}</b><small>${S[k]?'चालू':'बंद'}</small></button>`).join('')}
$('#grid').onclick=e=>{const b=e.target.closest('.dev');if(b){S[b.dataset.k]^=1;save();render()}};
function log(w,t){const d=document.createElement('div');d.className=w;d.textContent=(w==='U'?'🧑 ':'🤖 ')+t;$('#log').prepend(d);while($('#log').children.length>8)$('#log').lastChild.remove()}
function say(t){log('J',t);try{const u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const has=(t,a)=>a.some(x=>/^[a-z]+$/.test(x)?W.includes(x):t.includes(x));
const ON=['on','चालू','चला','जला','खोल','chalu','chala','jala','start'],OFF=['off','बंद','बुझा','band','bujha','stop'];
function pc(o){if(!ws||ws.readyState!==1)return say('PC एजेंट जुड़ा नहीं है। नीचे से जोड़ो।');ws.send(JSON.stringify(o))}
function run(raw){
 const t=raw.toLowerCase().trim();if(!t)return;W=t.split(/[\s,.?!]+/);log('U',raw);
 if(has(t,['good night','गुड नाइट','शुभ रात्रि'])){Object.keys(S).forEach(k=>S[k]=0);save();render();return say('शुभ रात्रि '+NAME+'। सब बंद कर दिया।')}
 if(has(t,['good morning','गुड मॉर्निंग','सुप्रभात'])){S.light=1;S.fan=1;save();render();return say('सुप्रभात '+NAME+'। लाइट और पंखा चालू कर दिए।')}
 const dk=Object.keys(D).find(k=>has(t,D[k].k));
 if(dk&&(has(t,ON)||has(t,OFF))){S[dk]=has(t,OFF)?0:1;save();render();return say(D[dk].n+(S[dk]?' चालू':' बंद')+' कर दिया।')}
 if(has(t,['volume','वॉल्यूम','आवाज़'])){const d=has(t,['up','बढ़ा','badha','increase'])?'up':has(t,['down','कम','kam','decrease'])?'down':has(t,['mute','म्यूट'])?'mute':'';
  return d?pc({action:'volume',dir:d}):say('वॉल्यूम बढ़ाना है, घटाना है या म्यूट?')}
 if(has(t,['screenshot','स्क्रीनशॉट']))return pc({action:'screenshot'});
 const apps={notepad:['notepad','नोटपैड'],calculator:['calculator','कैलकुलेटर'],chrome:['chrome','क्रोम'],vscode:['vscode','वीएस कोड']};
 const ak=Object.keys(apps).find(k=>has(t,apps[k]));if(ak)return pc({action:'open_app',name:ak});
 const tm=t.match(/(\d+)\s*(min|मिनट|sec|सेकंड|second)/);
 if(tm&&has(t,['timer','टाइमर'])){const n=+tm[1],ms=n*(/^(min|मिनट)/.test(tm[2])?60000:1000);setTimeout(()=>say('टाइमर पूरा हुआ।'),ms);return say('टाइमर '+tm[0]+' का सेट किया।')}
 if(has(t,['time','टाइम','समय','baje']))return say('अभी '+new Date().toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'})+' हुए हैं।');
 if(has(t,['youtube','यूट्यूब'])){window.open('https://www.youtube.com','_blank');return say('YouTube खोल रहा हूँ।')}
 if(has(t,['google','गूगल'])){window.open('https://www.google.com','_blank');return say('Google खोल रहा हूँ।')}
 ask(raw);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function onVoice(t){
 if(!$('#wake').checked)return run(t);
 const m=t.match(/jarvis|जार्विस|जारविस|जरविस|जार्वस/i);if(!m)return;
 const rest=t.slice(m.index+m[0].length).trim();
 rest?run(rest):say('जी '+NAME+', बोलिए।');
}
function startRec(){
 rec=new SR();rec.lang='hi-IN';rec.continuous=$('#wake').checked;rec.interimResults=false;
 rec.onresult=e=>onVoice(e.results[e.results.length-1][0].transcript);
 rec.onend=()=>{if(listening&&$('#wake').checked){try{startRec()}catch(e){}}else{listening=false;$('#mic').classList.remove('hot')}};
 rec.onerror=e=>{if(e.error==='not-allowed'){listening=false;say('माइक की अनुमति दो।')}};
 rec.start();
}
$('#mic').onclick=()=>{
 if(!SR)return say('इस ब्राउज़र में वॉइस सपोर्ट नहीं है। Chrome इस्तेमाल करो।');
 if(listening){listening=false;try{rec.stop()}catch(e){}$('#mic').classList.remove('hot');return}
 listening=true;$('#mic').classList.add('hot');startRec();
};
$('#go').onclick=()=>{run($('#txt').value);$('#txt').value=''};
$('#txt').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>run(b.dataset.r));
$('#conn').onclick=()=>{
 try{ws=new WebSocket('ws://127.0.0.1:8765');
  ws.onopen=()=>ws.send(JSON.stringify({token:$('#tok').value.trim()}));
  ws.onmessage=e=>{const r=JSON.parse(e.data);if(r.hello)$('#ps').textContent=r.ok?'🟢 PC जुड़ा':'🔴 गलत token';else say(r.msg)};
  ws.onclose=()=>{$('#ps').textContent='⚪ जुड़ा नहीं'};
  ws.onerror=()=>{$('#ps').textContent='🔴 एजेंट नहीं मिला। agent.py चलाओ और पेज लोकल खोलो।'};
 }catch(e){$('#ps').textContent='🔴 कनेक्शन नहीं बना'}
};
function enter(){$('#auth').hidden=true;$('#app').hidden=false;render()}
async function doAuth(kind){try{const j=await api('/api/'+kind,'POST',{name:$('#an').value,email:$('#ae').value,password:$('#ap').value});TOKEN=j.token;try{localStorage.setItem('jt',TOKEN)}catch(e){}NAME=j.name;S=Object.assign(S,j.devices);enter();say('नमस्ते '+NAME+'।')}catch(e){$('#aerr').textContent=e.message}}
$('#li').onclick=()=>doAuth('login');$('#su').onclick=()=>doAuth('signup');
$('#lo').onclick=()=>{try{localStorage.removeItem('jt')}catch(e){}location.reload()};
if(TOKEN)api('/api/me').then(j=>{NAME=j.name;S=Object.assign(S,j.devices);enter()}).catch(()=>{$('#auth').hidden=false});else $('#auth').hidden=false;
</script>
</body>
</html>
